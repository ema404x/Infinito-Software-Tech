<style>
:root{
  --brand:#3f83c3;--brand-dark:#2c6aa6;--brand-soft:#e8f1fa;--teal:#64b3b8;
  --ink:#0b0d10;--bg:#f3f5f8;--card:#fff;--text:#1a2230;--muted:#646f82;--line:#e2e6ed;
  --ok:#15803d;--ok-soft:#e6f5ea;--warn:#b45309;--warn-soft:#fdf1e1;--bad:#c62828;--bad-soft:#fdeaea;
  --wa:#1fa855;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:30px;width:auto;display:block}
.logo b{display:block;font-size:17px;font-weight:800;letter-spacing:1px;line-height:1.05}
.logo small{display:block;font-size:9.5px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;opacity:.8;line-height:1.2}
.demo-pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;background:rgba(100,179,184,.2);color:#9fd6da;padding:3px 8px;border-radius:99px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.75);font-weight:600}
.seg button.on{background:var(--brand);color:#fff}
.topbar select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff;padding:6px 10px;width:auto}
.topbar select option{color:#111}
.topbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.topbar .btn:hover{background:rgba(255,255,255,.08)}
.shell{display:flex;max-width:1200px;margin:0 auto}
.side{width:220px;flex:none;padding:20px 12px;position:sticky;top:58px;align-self:flex-start}
.side a,.bottom a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer}
.side a.on{background:var(--brand-soft);color:var(--brand)}
.side a:hover{background:#e9edf3}
.side svg,.bottom svg{width:20px;height:20px;flex:none}
main{flex:1;min-width:0;padding:20px 16px 100px}
body.is-tec .side,body.is-tec .bottom{display:none}
body.is-tec main{max-width:540px;margin:0 auto}
.bottom{display:none}
@media (max-width:900px){
 .side{display:none}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
 .bottom a{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:8px 2px}
 .bottom a.on{color:var(--brand)}
}
@media (max-width:560px){.logo small,.demo-pill,.topbar .btn[data-action="reset"]{display:none}.top-right{margin-left:0;width:100%;flex-wrap:nowrap}.seg{flex:1}.seg button{flex:1;padding:6px 8px}#tecSel{flex:1;min-width:0}}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.3px;font-weight:700}
h2{font-size:16px;margin:0 0 12px;font-weight:700}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--brand)}
.kpi .n{font-size:28px;font-weight:800;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi.bad{border-top-color:var(--bad)}.kpi.bad .n{color:var(--bad)}
.kpi.ok{border-top-color:var(--ok)}.kpi.ok .n{color:var(--ok)}
.kpi.teal{border-top-color:var(--teal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--text);font-size:13.5px}
.btn:hover{background:#f5f7fa}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.big{width:100%;padding:14px;font-size:15px;border-radius:12px}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:#eef1f5;color:var(--muted);white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-brand{background:var(--brand-soft);color:var(--brand)}
.list{display:flex;flex-direction:column;gap:8px}
.ot-row{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.ot-row:hover{border-color:#b9cfe6}
.ot-title{font-weight:600}
.ot-title .num{color:var(--muted);font-weight:500;margin-right:5px}
.ot-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.ot-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:600px){.ot-row{flex-direction:column;align-items:flex-start}.ot-tags{justify-content:flex-start}}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
@media (max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
input[type=text],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:80px;resize:vertical}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px;color:#344054}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
@media (max-width:600px){.info{grid-template-columns:1fr 1fr}}
.info .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.info .v{font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#dde3ea}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .vid{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1f2937;color:#fff;font-size:22px}
.thumb .vid span{font-size:10px;opacity:.8;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.empty-sm{color:var(--muted);font-size:13.5px;padding:6px 0}
.step{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step .dot{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.step h2{margin:0}
.step .right{margin-left:auto;font-size:12.5px;color:var(--muted)}
.chk{border-top:1px solid var(--line);padding:10px 0}
.chk:first-of-type{border-top:0}
.chk-t{margin-bottom:6px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{border:1px solid var(--line);background:var(--card);padding:8px;border-radius:9px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg3 button.on.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg3 button.on.falla{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.seg3 button.on.na{background:#eef1f5;border-color:#98a2b3;color:#344054}
.chk-obs{margin-top:6px}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sig{width:100%;height:170px;border:1.5px dashed #b6c2d2;border-radius:12px;background:#fff;touch-action:none;display:block;cursor:crosshair}
.mat{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.mat:first-child{border-top:0}
.mat-add{display:grid;grid-template-columns:1fr 80px auto;gap:6px;margin-top:8px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 12px 20px;font-size:13.5px}
.timeline li:before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.timeline li:after{content:"";position:absolute;left:7.5px;top:16px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child:after{display:none}
.timeline small{display:block;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;cursor:pointer;margin-bottom:12px;border:0;background:none;padding:0}
.hello{background:linear-gradient(135deg,var(--teal),var(--brand) 55%,var(--brand-dark));color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
.hello h1{color:#fff}.hello p{margin:0;opacity:.92}
.hello img{position:absolute;right:-18px;bottom:-14px;height:110px;opacity:.18;filter:brightness(3)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);padding:9px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);cursor:pointer;display:block}
.tcard .ot-title{font-size:15.5px;margin-top:2px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.done-hero{text-align:center;padding:28px 16px}
.done-hero .ic{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px;font-size:38px}
.stack{display:flex;flex-direction:column;gap:8px}
.suc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.suc:first-of-type{border-top:0}
.suc:hover .ot-title{color:var(--brand)}
.overlay{position:fixed;inset:0;z-index:50;display:none}
.overlay.open{display:block}
#modal{background:rgba(11,13,16,.5);overflow:auto;padding:24px 16px}
.modal-box{background:var(--card);max-width:560px;margin:0 auto;border-radius:16px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-box .grid2{gap:0 12px}
#report{background:#e6eaf0;overflow:auto}
.rep-bar{position:sticky;top:0;background:var(--ink);padding:10px 16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;z-index:2}
.rep-bar .btn:not(.primary):not(.wa){background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.rep{background:#fff;max-width:800px;margin:24px auto;padding:36px 40px;box-shadow:0 4px 24px rgba(0,0,0,.08);border-radius:4px;color:#111}
@media (max-width:700px){.rep{margin:0;padding:20px 16px;border-radius:0}}
.rep-head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--brand);padding-bottom:14px;margin-bottom:18px;gap:12px}
.rep-logo{display:flex;align-items:center;gap:12px;color:var(--ink)}
.rep-logo img{height:44px}
.rep-logo b{display:block;font-size:22px;font-weight:800;letter-spacing:1.5px;line-height:1}
.rep-logo small{display:block;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.rep-num{text-align:right;font-size:11px;color:#555;letter-spacing:.6px;font-weight:600}
.rep-num b{display:block;font-size:26px;color:var(--brand);letter-spacing:0;font-weight:800}
.rep h1{font-size:21px;margin:0 0 14px}
.rep h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--brand);margin:20px 0 8px;border-bottom:1px solid #e5e7eb;padding-bottom:4px}
@media (min-width:600px){.rep .info{grid-template-columns:repeat(3,1fr)}.rep .thumbs{grid-template-columns:repeat(3,1fr)}}
.rep-sign{display:flex;justify-content:flex-end;margin-top:28px}
.rep-sign>div{text-align:center;min-width:240px}
.rep-sign img{max-width:240px;height:90px;object-fit:contain;display:block;margin:0 auto}
.rep-sign .line{border-top:1px solid #333;padding-top:4px;font-size:12.5px}
.rep-foot{margin-top:28px;padding-top:10px;border-top:1px solid #e5e7eb;font-size:10.5px;color:#777;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.res-ok{color:var(--ok);font-weight:700}.res-falla{color:var(--bad);font-weight:700}.res-na{color:#777;font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cfg-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cfg-tabs button{flex:none;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.cfg-tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.scroll-x{overflow-x:auto}
.nowrap{white-space:nowrap}
.pl-item{display:grid;grid-template-columns:22px 1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.pl-n{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.btn:disabled{opacity:.4;cursor:default}
.chip-c{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand-dark);font-weight:600;font-size:13px;padding:5px 6px 5px 12px;border-radius:99px}
.chip-c button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:22px;height:22px;cursor:pointer;color:inherit;font-size:14px;line-height:1}
.logo-prev{height:52px;width:auto;background:var(--ink);padding:8px 10px;border-radius:10px}
.wa-prev{white-space:pre-wrap;background:#e7f7ec;border-radius:12px 12px 12px 2px;padding:12px 14px;font:inherit;font-size:13.5px;margin:0;color:#14361f}
.exp-f{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:700px){.exp-f{grid-template-columns:1fr 1fr}}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media print{
 body.rep-open > *:not(#report){display:none!important}
 body{background:#fff}
 #report{position:static;display:block;background:#fff;overflow:visible}
 .no-print{display:none!important}
 .rep{box-shadow:none;margin:0;max-width:none;padding:0}
 .rep .info{grid-template-columns:repeat(3,1fr)}.rep .thumbs{grid-template-columns:repeat(3,1fr)}
 .rep h3,.rep-sign,.thumb,tr{break-inside:avoid}
 @page{margin:14mm}
}
</style>

function bEstado(o){
 if(o.estado==='Completada')return '<span class="badge b-ok">✓ Completada</span>';
 const curso=o.estado==='En curso'?'<span class="badge b-warn">En curso</span>':'';
 if(vencida(o))return '<span class="badge b-bad">Vencida</span>'+curso;
 return curso||'<span class="badge b-brand">Abierta</span>';
}
function bPrio(p){return `<span class="badge ${p==='Alta'?'b-bad':p==='Media'?'b-warn':''}">${p==='Alta'?'▲ ':''}${p}</span>`}
function bVence(o){
 if(o.estado==='Completada')return `<span class="badge">Cerrada ${fDate(o.completado)}</span>`;
 const t=today();const lbl=o.vence===t?'Vence hoy':o.vence===d(1)?'Vence mañana':'Vence '+fDate(o.vence);
 return `<span class="badge ${o.vence<t?'b-bad':o.vence<=d(1)?'b-warn':''}">${lbl}</span>`;

function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1280;const k=Math.min(1,max/Math.max(img.width,img.height));const w=Math.round(img.width*k),h=Math.round(img.height*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.7))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function handleFotos(input){
 const o=getOT(input.dataset.id);const k=input.dataset.foto;const files=[...input.files];let antes=0,despues=0,vids=0;
 for(const f of files){
  if(f.type.startsWith('video/')){o[k].push({video:f.name});vids++;continue}
  try{const src=await compress(f);antes+=f.size;despues+=Math.round(src.length*0.75);o[k].push({src})}catch(e){toast('No se pudo leer la imagen')}
 }
 save();render();
 if(antes)toast(`Foto${files.length>1?'s':''} optimizada${files.length>1?'s':''}: ${kb(antes)} → ${kb(despues)}`);
 else if(vids)toast('Video agregado. En la versión final se comprime antes de subirlo.');
}
function initFirma(){
 const c=document.getElementById('firma');if(!c)return;const o=getOT(ui.param);
 const ratio=window.devicePixelRatio||1;const rect=c.getBoundingClientRect();
 c.width=Math.round(rect.width*ratio);c.height=Math.round(rect.height*ratio);
 const ctx=c.getContext('2d');ctx.scale(ratio,ratio);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#14213d';
 if(o.firmaDraft&&o.firmaDraft.img){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,rect.width,rect.height);im.src=o.firmaDraft.img}
 let drawing=false,last=null;
 const pos=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
 c.onpointerdown=e=>{drawing=true;last=pos(e);c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],1.1,0,7);ctx.fillStyle='#14213d';ctx.fill()};
 c.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p};
 c.onpointerup=c.onpointercancel=()=>{if(!drawing)return;drawing=false;o.firmaDraft=o.firmaDraft||{};o.firmaDraft.img=c.toDataURL('image/png');save()};
}
function cerrar(id){

 if(pend){toast(`Faltan ${pend} ítem${pend>1?'s':''} del checklist`);return}
 if(!(o.firmaDraft&&o.firmaDraft.img)){toast('Falta la firma del encargado');const f=document.getElementById('firma');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return}
 const inp=document.getElementById('fNombre');const nombre=(inp?inp.value:'').trim();
 if(!nombre){toast('Completá la aclaración de la firma');return}
 if(!o.fotosDespues.length&&!o._sinFotosOk){o._sinFotosOk=true;toast('No cargaste fotos de después. Tocá "Cerrar" de nuevo para cerrar igual.');return}
 delete o._sinFotosOk;
 const now=new Date().toISOString();
 o.estado='Completada';o.completado=now;o.firma={img:o.firmaDraft.img,nombre,fecha:now};o.firmaDraft=null;
 o.historial.push({t:now,txt:tecName(o.tecnicoId)+' completó la orden'});save();go('cerrada',id);
}

 <div class="grid2">${S.plantillas.map(p=>`<div class="card"><div class="field"><label for="pl-${p.id}">Nombre del checklist</label><input type="text" id="pl-${p.id}" data-bind="plNombre" data-id="${p.id}" value="${esc(p.nombre)}"></div>
 ${p.items.map((it,i)=>`<div class="pl-item"><span class="pl-n">${i+1}</span><input type="text" id="pl-${p.id}-${i}" aria-label="Ítem ${i+1}" data-bind="plItem" data-id="${p.id}" data-idx="${i}" value="${esc(it)}"><button class="btn sm" data-action="plUp" data-id="${p.id}" data-idx="${i}" aria-label="Subir ítem" ${i?'':'disabled'}>↑</button><button class="btn sm" data-action="plDel" data-id="${p.id}" data-idx="${i}" aria-label="Quitar ítem">×</button></div>`).join('')}
 <div class="mat-add" style="grid-template-columns:1fr auto"><input type="text" id="plNew-${p.id}" placeholder="Nuevo ítem"><button class="btn" data-action="plAdd" data-id="${p.id}">Agregar</button></div></div>`).join('')}</div>`;
}
function cfgCategorias(){
 return `<div class="card"><h2>Categorías de trabajo</h2><p class="ot-sub" style="margin:0 0 12px">Se usan para clasificar las órdenes y filtrar los reportes.</p>
 <div class="row">${S.categorias.map((c,i)=>`<span class="chip-c">${esc(c)}<button data-action="catDel" data-idx="${i}" aria-label="Quitar ${esc(c)}">×</button></span>`).join('')}</div>
 <div class="mat-add" style="grid-template-columns:1fr auto;max-width:440px;margin-top:14px"><input type="text" id="catNew" placeholder="Nueva categoría, ej: Cerrajería"><button class="btn" data-action="catAdd">Agregar</button></div></div>`;
}
function cfgEmpresa(){const e=S.empresa;
 return `<div class="grid2"><div class="card"><h2>Datos de la empresa</h2>
 <div class="row" style="gap:14px;margin-bottom:14px"><img src="${e.logo}" alt="Logo actual" class="logo-prev"><label class="btn sm upload">Cambiar logo<input type="file" accept="image/*" data-logo="1" aria-label="Cambiar logo"></label></div>
 ${[['nombre','Nombre'],['bajada','Bajada (va en el pie del reporte)'],['dir','Dirección'],['web','Sitio web']].map(([k,l])=>`<div class="field"><label for="emp-${k}">${l}</label><input type="text" id="emp-${k}" data-bind="emp" data-k="${k}" value="${esc(e[k])}"></div>`).join('')}
 <button class="btn sm" data-action="report" data-id="${sampleOT().id}">Ver cómo queda el reporte</button></div>
 <div class="card"><h2>Mensaje de WhatsApp</h2><p class="ot-sub" style="margin:0 0 8px">Podés usar: {ot} {titulo} {cliente} {sucursal} {estado} {link} {empresa}</p>
 <textarea id="emp-wa" data-bind="emp" data-k="waTpl" style="min-height:170px">${esc(e.waTpl)}</textarea>
 <h2 style="margin-top:16px">Vista previa</h2><pre class="wa-prev" id="waPrev">${esc(waText(sampleOT()))}</pre></div></div>`;
}
function expRows(){const f=ui.exp;
 const os=S.ots.filter(o=>{const fecha=(o.historial[0]&&o.historial[0].t||'').slice(0,10);return fecha>=f.desde&&fecha<=f.hasta&&(!f.cliente||sucOf(o.sucursalId).c.id===f.cliente)}).sort((a,b)=>a.id-b.id);
 if(f.que==='mat'){const r=[['OT','Fecha','Cliente','Sucursal','Material','Cantidad','Técnico']];
  os.forEach(o=>{const {c,s}=sucOf(o.sucursalId);o.materiales.forEach(m=>r.push([o.id,fDate(o.completado||o.historial[0].t),c.nombre,s.nombre,m.nombre,m.cant,tecName(o.tecnicoId)]))});return r}
 return [['OT','Título','Cliente','Sucursal','Tipo','Categoría','Prioridad','Técnico','Estado','Creada','Vence','Cerrada'],
  ...os.map(o=>{const {c,s}=sucOf(o.sucursalId);return [o.id,o.titulo,c.nombre,s.nombre,o.tipo,o.categoria,o.prioridad,tecName(o.tecnicoId),o.estado,fDate(o.historial[0].t),fDate(o.vence),o.completado?fDate(o.completado):'']})];
}
function expTable(rows){const body=rows.slice(1,9);
 return `<table class="t"><thead><tr>${rows[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(v=>`<td class="nowrap">${esc(v)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${rows[0].length}" class="empty-sm">No hay datos en ese período.</td></tr>`}</tbody></table>${rows.length>9?`<p class="ot-sub">… y ${rows.length-9} filas más.</p>`:''}`;
}
function cfgExportar(){const f=ui.exp;const rows=expRows();
 return `<div class="card"><h2>Exportar a Excel</h2><p class="ot-sub" style="margin:0 0 12px">Para facturar, controlar materiales o armar reportes propios.</p>
 <div class="exp-f"><div class="field"><label for="expDesde">Desde</label><input type="date" id="expDesde" data-exp="desde" value="${f.desde}"></div>
 <div class="field"><label for="expHasta">Hasta</label><input type="date" id="expHasta" data-exp="hasta" value="${f.hasta}"></div>
 <div class="field"><label for="expCli">Cliente</label><select id="expCli" data-exp="cliente"><option value="">Todos</option>${S.clientes.map(c=>`<option value="${c.id}" ${f.cliente===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div>
 <div class="field"><label for="expQue">Qué exportar</label><select id="expQue" data-exp="que"><option value="ots" ${f.que==='ots'?'selected':''}>Órdenes de trabajo</option><option value="mat" ${f.que==='mat'?'selected':''}>Materiales usados</option></select></div></div>
 <div class="row between" style="margin:4px 0 10px"><span class="ot-sub">${rows.length-1} fila${rows.length===2?'':'s'}</span><div class="row">${EMBED?'':'<button class="btn primary sm" data-action="expDl">Descargar Excel (.csv)</button>'}<button class="btn sm ${EMBED?'primary':''}" data-action="expCopy">Copiar para pegar en Excel</button></div></div>
 <div class="scroll-x">${expTable(rows)}</div></div>`;
}
function openModal(title,body,act,id){
 const m=document.getElementById('modal');
 m.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row between" style="margin-bottom:12px"><h2 style="margin:0">${esc(title)}</h2><button class="btn sm" data-action="closeModal" aria-label="Cerrar">×</button></div>${body}
 <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-action="closeModal">Cancelar</button><button class="btn primary" data-action="${act}" data-id="${id||''}">Guardar</button></div></div>`;
 m.classList.add('open');setTimeout(()=>{const f=m.querySelector('input,select,textarea');if(f)f.focus()},50);
}
const val=id=>(document.getElementById(id)||{}).value||'';

/* ---------- render ---------- */
const NAV=[['panel','Panel'],['ordenes','Órdenes'],['clientes','Clientes'],['preventivos','Preventivos'],['config','Ajustes']];
function renderTop(){
 const tl=document.getElementById('topLogo');if(tl&&tl.src!==S.empresa.logo)tl.src=S.empresa.logo;
 if(ui.role==='tec'&&!tecs().some(t=>t.id===ui.tec)&&tecs()[0])ui.tec=tecs()[0].id;
 document.getElementById('rSup').classList.toggle('on',ui.role==='sup');
 document.getElementById('rTec').classList.toggle('on',ui.role==='tec');
 const sel=document.getElementById('tecSel');sel.style.display=ui.role==='tec'?'':'none';
 sel.innerHTML=tecs().map(t=>`<option value="${t.id}" ${t.id===ui.tec?'selected':''}>${esc(t.nombre)}</option>`).join('');
}
function renderNav(){
 const act={ot:'ordenes',sucursal:'clientes'}[ui.view]||ui.view;
 const h=NAV.map(([v,l])=>`<a href="#" class="${act===v?'on':''}" data-action="nav" data-view="${v}">${IC[v]}<span>${l}</span></a>`).join('');
 document.getElementById('side').innerHTML=h;document.getElementById('bottom').innerHTML=h;
}
function render(){
 renderTop();document.body.classList.toggle('is-tec',ui.role==='tec');
 const V=ui.role==='sup'?{panel:vPanel,ordenes:vOrdenes,ot:vDetalle,clientes:vClientes,sucursal:vSucursal,preventivos:vPreventivos,config:vConfig}:{mis:vMis,ejecutar:vEjecutar,cerrada:vCerrada};
 const fn=V[ui.view]||(ui.role==='sup'?vPanel:vMis);
 document.getElementById('main').innerHTML=fn(ui.param);
 renderNav();
 if(ui.view==='ejecutar')initFirma();
}
function go(view,param){ui.view=view;ui.param=param==null?null:param;render();window.scrollTo(0,0)}

/* ---------- acciones ---------- */
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800)}
const A={
 role:el=>{ui.role=el.dataset.role;go(ui.role==='sup'?'panel':'mis')},
 nav:el=>go(el.dataset.view),
 open:(el,id)=>{const o=getOT(id);if(ui.role==='sup')go('ot',+id);else go(o.estado==='Completada'?'cerrada':'ejecutar',+id)},
 sucursal:(el,id)=>go('sucursal',id),
 nuevaOT:el=>openNueva(el.dataset.suc),
 closeModal:()=>closeModal(),
 crearOT:()=>{const v=id=>document.getElementById(id).value;const tipo=v('nTipo');const pid=tipo==='Preventivo'?v('nPlantilla'):null;const titulo=v('nTitulo').trim();
  if(!titulo&&!pid){toast('Poné un título para la OT');document.getElementById('nTitulo').focus();return}
  const o=newOT({titulo:titulo||plantilla(pid).nombre,desc:v('nDesc').trim()||'—',sucursalId:v('nSucursal'),tipo,plantillaId:pid,categoria:v('nCat'),prioridad:v('nPrio'),tecnicoId:v('nTec'),vence:v('nVence')||d(3),estimado:v('nEst')});
  closeModal();toast(`OT #${o.id} creada y asignada a ${tecName(o.tecnicoId)}`);go('ot',o.id)},
 genOT:(el,id)=>{const g=S.programas.find(x=>x.id===id);const p=plantilla(g.plantillaId);
  const o=newOT({titulo:p.nombre,desc:`Revisión ${g.cada.toLowerCase()} programada.`,sucursalId:g.sucursalId,tipo:'Preventivo',plantillaId:p.id,categoria:'General',prioridad:'Media',tecnicoId:g.tecnicoId,vence:g.proxima,estimado:'2 h'});
  const x=new Date(g.proxima+'T12:00');x.setDate(x.getDate()+({Mensual:30,Trimestral:90,Semestral:180}[g.cada]||30));g.proxima=iso(x);save();
  toast(`OT #${o.id} generada para ${tecName(o.tecnicoId)}`);go('ot',o.id)},
 report:(el,id)=>showReport(+id),
 closeReport:()=>closeReport(),
 print:()=>window.print(),
 share:(el,id)=>shareOT(+id),
 verTec:(el,id)=>{const o=getOT(id);ui.role='tec';ui.tec=o.tecnicoId;ui.tecTab='pend';go('ejecutar',+id)},
 iniciar:(el,id)=>{const o=getOT(id);o.estado='En curso';o.historial.push({t:new Date().toISOString(),txt:tecName(o.tecnicoId)+' inició el trabajo'});save();render()},
 chk:(el,id)=>{const x=getOT(id).checklist[+el.dataset.idx];const v=el.dataset.val;x.res=x.res===v?null:v;save();render()},
 delFoto:(el,id)=>{getOT(id)[el.dataset.kind].splice(+el.dataset.idx,1);save();render()},
 addMat:(el,id)=>{const n=document.getElementById('matN').value.trim();const c=document.getElementById('matC').value.trim()||'1';if(!n){toast('Escribí el material');return}
  getOT(id).materiales.push({nombre:n,cant:c});save();render();const f=document.getElementById('matN');if(f)f.focus()},
 delMat:(el,id)=>{getOT(id).materiales.splice(+el.dataset.idx,1);save();render()},
 limpiarFirma:(el,id)=>{const o=getOT(id);if(o.firmaDraft)o.firmaDraft.img=null;save();render()},
 cerrarOT:(el,id)=>cerrar(+id),
 tecTab:(el,id)=>{ui.tecTab=id;render()},
 reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();go(ui.role==='sup'?'panel':'mis');toast('Demo reiniciada')}
};
Object.assign(A,{
 goCfg:(el,id)=>{ui.cfgTab=id;go('config')},
 cfgTab:(el,id)=>{ui.cfgTab=id;render()},
 reabrir:(el,id)=>{const o=getOT(id);o.estado='En curso';o.firmaDraft=o.firma?{img:o.firma.img,nombre:o.firma.nombre}:null;o.firma=null;o.completado=null;
  o.historial.push({t:new Date().toISOString(),txt:SUP+' reabrió la orden'});save();render();toast(`OT #${o.id} reabierta`)},
 userNew:()=>userForm(),
 userEdit:(el,id)=>userForm(S.usuarios.find(u=>u.id===id)),
 userSave:(el,id)=>{const nombre=val('uNombre').trim();if(!nombre){toast('Escribí el nombre del usuario');return}
  const data={nombre,rol:val('uRol'),contacto:val('uContacto').trim()};
  if(id)Object.assign(S.usuarios.find(u=>u.id===id),data);else S.usuarios.push({id:'u'+Date.now(),activo:true,...data});
  save();closeModal();render();toast(id?'Usuario actualizado':`Usuario creado: ${nombre}`)},
 userReset:(el,id)=>{const u=S.usuarios.find(x=>x.id===id);toast(`${u.nombre} va a recibir un link para crear una clave nueva (en la demo no se envía).`)},
 userToggle:(el,id)=>{const u=S.usuarios.find(x=>x.id===id);u.activo=u.activo===false;save();render();
  const abiertas=S.ots.filter(o=>o.tecnicoId===id&&o.estado!=='Completada').length;
  toast(u.activo?`${u.nombre} puede volver a entrar`:`${u.nombre} ya no puede entrar${abiertas?`. Tiene ${abiertas} OT abierta${abiertas>1?'s':''}: reasignalas desde Órdenes`:''}`)},
 cliNew:()=>openModal('Nuevo cliente','<div class="field"><label for="cNombre">Nombre del cliente</label><input type="text" id="cNombre" placeholder="Ej: Farmacia Central"></div>','cliSave'),
 cliEdit:(el,id)=>{const c=S.clientes.find(x=>x.id===id);openModal('Renombrar cliente',`<div class="field"><label for="cNombre">Nombre del cliente</label><input type="text" id="cNombre" value="${esc(c.nombre)}"></div>`,'cliSave',id)},
 cliSave:(el,id)=>{const nombre=val('cNombre').trim();if(!nombre){toast('Escribí el nombre del cliente');return}
  if(id)S.clientes.find(c=>c.id===id).nombre=nombre;else S.clientes.push({id:'c'+Date.now(),nombre,sucursales:[]});
  save();closeModal();render();toast(id?'Cliente actualizado':`Cliente creado. Ahora agregale sus sucursales.`)},
 sucNew:()=>sucForm(),
 sucEdit:(el,id)=>sucForm(id),
 sucSave:(el,id)=>{const nombre=val('sNombre').trim();if(!nombre){toast('Escribí el nombre de la sucursal');return}
  const data={nombre,dir:val('sDir').trim(),contacto:val('sContacto').trim(),tel:val('sTel').trim()};const cid=val('sCli');
  if(id){const cur=sucOf(id);Object.assign(cur.s,data);if(cur.c.id!==cid){cur.c.sucursales=cur.c.sucursales.filter(x=>x.id!==id);S.clientes.find(c=>c.id===cid).sucursales.push(cur.s)}}
  else S.clientes.find(c=>c.id===cid).sucursales.push({id:'s'+Date.now(),...data});
  save();closeModal();render();toast(id?'Sucursal actualizada':'Sucursal creada')},
 plNew:()=>{const p={id:'p'+Date.now(),nombre:'Nuevo checklist',items:['Primer ítem']};S.plantillas.push(p);save();render();const f=document.getElementById('pl-'+p.id);if(f){f.focus();f.select()}},
 plAdd:(el,id)=>{const inp=document.getElementById('plNew-'+id);const t=(inp.value||'').trim();if(!t){toast('Escribí el ítem');return}plantilla(id).items.push(t);save();render();const f=document.getElementById('plNew-'+id);if(f)f.focus()},
 plDel:(el,id)=>{const p=plantilla(id);if(p.items.length<2){toast('El checklist necesita al menos un ítem');return}p.items.splice(+el.dataset.idx,1);save();render()},
 plUp:(el,id)=>{const p=plantilla(id);const i=+el.dataset.idx;if(!i)return;[p.items[i-1],p.items[i]]=[p.items[i],p.items[i-1]];save();render()},
 catAdd:()=>{const t=val('catNew').trim();if(!t){toast('Escribí la categoría');return}if(S.categorias.some(c=>c.toLowerCase()===t.toLowerCase())){toast('Esa categoría ya existe');return}S.categorias.push(t);save();render();const f=document.getElementById('catNew');if(f)f.focus()},
 catDel:el=>{const i=+el.dataset.idx;const c=S.categorias[i];const n=S.ots.filter(o=>o.categoria===c).length;S.categorias.splice(i,1);save();render();toast(n?`Categoría quitada. Las ${n} OTs que la usaban la conservan.`:'Categoría quitada')},
 expCopy:async()=>{const tsv=expRows().map(r=>r.join('\t')).join('\n');try{await navigator.clipboard.writeText(tsv);toast('Copiado. Abrí Excel y pegá con Ctrl+V.')}catch(e){toast('No se pudo copiar desde acá. Probá desde la compu.')}},
 expDl:()=>{const csv='﻿'+expRows().map(r=>r.map(v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`ordenes-${ui.exp.desde}-a-${ui.exp.hasta}.csv`;document.body.appendChild(a);a.click();a.remove();toast('Archivo descargado')}
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.exp){ui.exp[el.dataset.exp]=el.value;render();return}
 if(el.dataset.prog){const g=S.programas.find(x=>x.id===el.dataset.id);g[el.dataset.prog]=el.value;save();toast('Programación actualizada');return}
 if(el.dataset.logo&&el.files[0]){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,400/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.empresa.logo=c.toDataURL('image/png');save();render();toast('Logo actualizado en la app y en los reportes')};img.src=r.result};r.readAsDataURL(el.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id||'';
 if(id.startsWith('plNew-')){e.preventDefault();A.plAdd(null,id.slice(6))}
 else if(id==='catNew'){e.preventDefault();A.catAdd()}
});
document.addEventListener('click',e=>{
 if(e.target.id==='modal'){closeModal();return}
 const el=e.target.closest('[data-action]');if(!el)return;
 if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();
 const fn=A[el.dataset.action];if(fn)fn(el,el.dataset.id,e);
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.f&&el.tagName==='SELECT'){ui.f[el.dataset.f]=el.value;const l=document.getElementById('otList');if(l)l.innerHTML=listHtml()}
 else if(el.dataset.foto)handleFotos(el);
 else if(el.id==='tecSel'){ui.tec=el.value;ui.tecTab='pend';go('mis')}
 else if(el.id==='nCliente')document.getElementById('nSucursal').innerHTML=sucOpts(el.value);
 else if(el.id==='nTipo')document.getElementById('wrapPl').style.display=el.value==='Preventivo'?'':'none';
 else if(el.dataset.reasignar){const o=getOT(el.dataset.reasignar);o.tecnicoId=el.value;o.historial.push({t:new Date().toISOString(),txt:'Reasignada a '+tecName(el.value)});save();render();toast('OT reasignada a '+tecName(el.value))}
});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.f==='q'){ui.f.q=el.value;document.getElementById('otList').innerHTML=listHtml();return}
 const bb=el.dataset.bind;
 if(bb==='emp'){S.empresa[el.dataset.k]=el.value;if(el.dataset.k==='waTpl'){const p=document.getElementById('waPrev');if(p)p.textContent=waText(sampleOT())}save();return}
 if(bb==='plNombre'){plantilla(el.dataset.id).nombre=el.value;save();return}
 if(bb==='plItem'){plantilla(el.dataset.id).items[+el.dataset.idx]=el.value;save();return}
 if(el.dataset.bind){const o=getOT(el.dataset.id);const b=el.dataset.bind;
  if(b==='obs')o.obs=el.value;else if(b==='chkobs')o.checklist[+el.dataset.idx].obs=el.value;else if(b==='firmaNombre'){o.firmaDraft=o.firmaDraft||{};o.firmaDraft.nombre=el.value}
  save()}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&(e.target.id==='matN'||e.target.id==='matC')){e.preventDefault();const b=document.querySelector('[data-action="addMat"]');if(b)b.click()}
 if(e.key==='Escape'){closeModal();closeReport()}
});
render();
</script>

</body></html>
